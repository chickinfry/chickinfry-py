[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "chickinfry"
version = "0.0.0"
description = "Sync and async transport and sessions for Chickinfry clients"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28.1,<0.29", "httpcore>=1.0.9,<2"]

[project.optional-dependencies]
server = ["asyncpg==0.32.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/chickinfry"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "README.md", "LICENSE", "requirements-dev.txt"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
addopts = "--basetemp=.cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["deadline_tight: numeric deadlines with a measured 0.05-second tolerance; run without competing heavy processes"]
