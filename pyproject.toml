[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "chickinfry"
version = "0.5.0.dev1"
description = "Sync and async transport and sessions for Chickinfry clients"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28.1,<0.29", "httpcore>=1.0.9,<2", "websockets>=16.0,<17"]

[project.optional-dependencies]
server = ["asyncpg==0.32.0; sys_platform != 'emscripten'"]

[tool.hatch.build.targets.wheel]
packages = ["src/chickinfry"]

[tool.hatch.build.targets.sdist]
# Leading slashes anchor these to the project root. Without them a bare name like
# README.md also matches the same file at any depth, which pulled build caches
# such as .ci-cache/xdg/pytest/README.md into the published sdist.
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/requirements-dev.txt",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
addopts = "--basetemp=.cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
